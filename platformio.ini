; ============================================================
; claude-desktop-buddy-esp32
;
; One firmware, many ESP32 touch displays. Each env below is one board:
; it names the board (BUDDY_BOARD_*, see src/board.h), points at that
; board's LovyanGFX panel config under board_configs/, and carries the
; flash/platform settings that board is known to need.
;
; Every env uses the pioarduino platform (Arduino-ESP32 3.3.x / ESP-IDF 5.5)
; — the RGB-parallel boards need its newer ESP-IDF for the bounce-buffer
; panel driver, and keeping the classic ESP32 boards on the same core means
; one BLE stack and one LEDC API to maintain.
; ============================================================

[platformio]
boards_dir = boards
default_envs = sunton-3248s035r

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform_packages =
	framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_src_filter = +<*> +<buddies/>
lib_deps =
	lovyan03/LovyanGFX @ 1.2.28
	bitbank2/AnimatedGIF @ ^2.1.1
	bblanchon/ArduinoJson @ ^7.0.0
	; NimBLE instead of Bluedroid: much less RAM and flash, which is what
	; lets a full-frame UI + BLE fit on the no-PSRAM classic ESP32 boards.
	h2zero/NimBLE-Arduino @ ^2.3.0
; The core's own BLE library brings a second NimBLE host that clashes with
; NimBLE-Arduino at link time. Only the ESP32-P4 envs use it (they override
; lib_ignore) — see src/ble_bridge_hosted.cpp.
lib_ignore =
	BLE
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DLGFX_USE_V1

; ---- Classic ESP32 (no PSRAM, SPI panel, CH340) ----------------------------

[classic]
upload_speed = 921600

; 2.8" ESP32-2432S028R "Cheap Yellow Display" — upstream's original board.
[env:cyd]
extends = classic
board = esp32-2432s028r
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_CYD
	-I board_configs/esp32-2432s028r

; Same board with "TPM408-2.8" glass: a native 320x240 mirrored RGB panel.
[env:cyd-tpm408]
extends = classic
board = esp32-2432s028r
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_CYD
	-I board_configs/esp32-2432s028r-tpm408

; 2.4" ESP32-2432S024C (capacitive).
[env:sunton-2432s024c]
extends = classic
board = esp32-2432s024c
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_SUNTON_2432S024C
	-I board_configs/esp32-2432s024c

; 3.5" ESP32-3248S035R (resistive).
[env:sunton-3248s035r]
extends = classic
board = esp32-3248s035r
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_SUNTON_3248S035R
	-I board_configs/esp32-3248s035r

; 3.5" ESP32-3248S035C (capacitive).
[env:sunton-3248s035c]
extends = classic
board = esp32-3248s035c
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_SUNTON_3248S035C
	-I board_configs/esp32-3248s035c

; ---- ESP32-S3 (PSRAM) --------------------------------------------------------

; 3.5" Elecrow CrowPanel Advance (ILI9488 SPI, native USB).
[env:elecrow-advance-3-5]
board = elecrow-crowpanel-advance-3-5
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_ELECROW_ADVANCE_3_5
	-I board_configs/elecrow-crowpanel-advance-3-5

; RGB-parallel panels. QIO flash (the board JSONs' DIO starves the PSRAM
; scan-out once WiFi is up) and the patched LovyanGFX RGB bus driver
; (bounce buffer + VSYNC double buffer, see scripts/apply_lovyangfx_rgb_patch.py).
[rgb]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
extra_scripts = pre:scripts/apply_lovyangfx_rgb_patch.py

; 4.3" ESP32-4827S043C (480x272).
[env:sunton-4827s043c]
extends = rgb
board = esp32-4827s043c
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_SUNTON_4827S043C
	-I board_configs/esp32-4827s043c

; 5" ESP32-8048S050C (Sunton; also sold as JC8048W550C).
[env:sunton-8048s050c]
extends = rgb
board = jc8048w550c
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_SUNTON_8048S050C
	-DPIXELCADE_S3_RGB_BOUNCE_LINES=20
	-I board_configs/jc8048w550c

; 7" ESP32-8048S070 (Sunton, no trailing C on the silkscreen).
[env:sunton-8048s070]
extends = rgb
board = esp32-8048s070
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_SUNTON_8048S070
	-DPIXELCADE_S3_RGB_BOUNCE_LINES=20
	-I board_configs/esp32-8048s070

; 7" Elecrow CrowPanel 7.0 HMI (V3.0 PCB, silkscreen ESP32-8048S070C).
[env:elecrow-7-0]
extends = rgb
board = esp32-8048s070c
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_ELECROW_7_0
	-DPIXELCADE_S3_RGB_BOUNCE_LINES=20
	-I board_configs/esp32-8048s070c

; 5" Elecrow CrowPanel 5.0 HMI (red, non-Advance, V3.0 PCB). Same board
; family as the 7" above, own panel timing.
[env:elecrow-5-0]
extends = rgb
board = esp32-8048s070c
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_ELECROW_5_0
	-DPIXELCADE_S3_RGB_BOUNCE_LINES=20
	-I board_configs/elecrow-crowpanel-5-0-v3

; 5" Elecrow CrowPanel Advance (v1.2/v1.3 PCB).
[env:elecrow-advance-5-0]
extends = rgb
board = elecrow-crowpanel-5-0-advance
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_ELECROW_ADVANCE_5_0
	-DPIXELCADE_S3_RGB_BOUNCE_LINES=20
	-DPIXELCADE_S3_RGB_RESTART_ON_COMMIT
	-I board_configs/elecrow-crowpanel-5-0-advance

; 5" Elecrow CrowPanel Advance, v1.1 PCB (different backlight chip protocol).
[env:elecrow-advance-5-0-v1_1]
extends = env:elecrow-advance-5-0
build_flags = ${env:elecrow-advance-5-0.build_flags}
	-DPIXELCADE_STC8H1K28_V1_1

; 4.3" Elecrow CrowPanel Advance — same board as the 5" Advance, smaller
; 800x480 panel.
[env:elecrow-advance-4-3]
extends = env:elecrow-advance-5-0
build_flags = ${env:elecrow-advance-5-0.build_flags}
	-DBUDDY_ELECROW_ADVANCE_4_3

; 2.1" Elecrow CrowPanel round (480x480, native USB).
[env:elecrow-round-2-1]
extends = rgb
board = elecrow-crowpanel-round-2-1
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_ELECROW_ROUND_2_1
	-I board_configs/elecrow-crowpanel-round-2-1

; ---- Layout previews (development only) --------------------------------------
; Run on a 3.5" ESP32-3248S035R set to landscape (480x320) and lay the UI out
; for another board's logical canvas, centred on the panel. Not published.
[env:sim-400x240]
extends = env:sunton-3248s035r
build_flags = ${env:sunton-3248s035r.build_flags}
	-DBUDDY_SIM_W=400 -DBUDDY_SIM_H=240

[env:sim-480x272]
extends = env:sunton-3248s035r
build_flags = ${env:sunton-3248s035r.build_flags}
	-DBUDDY_SIM_W=480 -DBUDDY_SIM_H=272

; ---- ESP32-P4 (no radio: BLE through the onboard ESP32-C6, ESP-Hosted) -------
; The core's own BLE library is used (it wraps the NimBLE host the P4 SDK is
; built with), so NimBLE-Arduino is left out — see src/ble_bridge_hosted.cpp.

; 4.3" Waveshare ESP32-P4-WIFI6-Touch-LCD-4.3 (480x800 MIPI-DSI, GT911).
[env:waveshare-p4-4-3]
board = m5stack-tab5-p4
board_build.partitions = default_16MB.csv
lib_deps =
	lovyan03/LovyanGFX @ 1.2.28
	bitbank2/AnimatedGIF @ ^2.1.1
	bblanchon/ArduinoJson @ ^7.0.0
lib_ignore =
	M5GFX
	M5Unified
	NimBLE-Arduino
build_flags = ${env.build_flags}
	-DBUDDY_BOARD_WAVESHARE_P4_4_3
	-DPIXELCADE_BOARD_ESP32_4_WAVESHARE
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-I board_configs/esp32-4-waveshare
